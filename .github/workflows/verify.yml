# Weekly verification.
# Plain-language summary: once a week (and on demand) this fetches finding
# cards for newly revealed findings (re-checking known cards monthly), checks
# each commitment hash (rule R2), looks up public records (rules R3 and R4:
# GitHub Advisory Database, NVD, GitHub commits and pull requests), rebuilds
# the published tables in data/, writes the weekly report, and opens or
# updates ONE pull request for Jon to review. Nothing about a specific finding
# reaches main until Jon merges that pull request.
# "sample_only" runs the lookups for 5 findings only (wolfSSL first), so the
# real response shapes can be checked before a full run.
name: Verify

on:
  schedule:
    - cron: "41 7 * * 1" # Mondays 07:41 UTC
  workflow_dispatch:
    inputs:
      sample_only:
        description: "Sample: look up public records for 5 findings only (wolfSSL first), on a separate review branch"
        type: boolean
        default: false
      diagnose_403:
        description: "Diagnostic only: 'auto' (the first 5 GHSA IDs GitHub refused for the token) or up to 5 comma-separated GHSA IDs. Leave EMPTY for a normal run."
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !inputs.diagnose_403 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write # push the review branch
      pull-requests: write # open or update the review pull request
      issues: write # open an issue if the run fails
    env:
      SAMPLE_ONLY: ${{ inputs.sample_only && 'true' || 'false' }}
    steps:
      - name: Check out the repository (full history, for first-seen commit times)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A run started before the previous review pull request is merged keeps that run's
      # lookups (records/ only) instead of making the same requests again.
      - name: Carry over lookups from an unmerged review branch
        env:
          REVIEW_BRANCH: ${{ inputs.sample_only && 'review/sample' || 'review/weekly' }}
        continue-on-error: true # never stops the run; the lookups are then simply made again
        run: bash scripts/carry_over_records.sh

      - name: Fetch new or due finding cards
        id: cards
        run: |
          set +e
          PYTHONPATH=src python3 -m verifier cards --summary-file "${RUNNER_TEMP}/cards.json"
          echo "exit_code=$?" >> "${GITHUB_OUTPUT}"
          exit 0

      # Everything below may fail without stopping the run: whatever happens,
      # the cards and records fetched are committed to the review branch.
      - name: Look up public records (R3, R4)
        id: lookups
        continue-on-error: true
        env:
          # The workflow's built-in token only; no other secret. Sent only to api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python3 -m verifier records --sample-only "${SAMPLE_ONLY}" \
            --summary-file "${RUNNER_TEMP}/records.json"

      - name: Rebuild data/ and the card checks
        id: build
        continue-on-error: true
        run: PYTHONPATH=src python3 -m verifier build

      - name: Write the report (with the wording guard)
        id: report
        continue-on-error: true
        run: |
          kind="weekly"; if [ "${SAMPLE_ONLY}" = "true" ]; then kind="sample"; fi
          file="reports/$(date -u +%Y-%m-%d)-${kind}.md"
          echo "file=${file}" >> "${GITHUB_OUTPUT}"
          PYTHONPATH=src python3 -m verifier report --date "$(date -u +%Y-%m-%d)" --out "${file}" --sample "${SAMPLE_ONLY}"

      - name: Tests
        id: tests
        continue-on-error: true
        run: PYTHONPATH=src:tests python3 -m unittest discover -s tests

      - name: Archive integrity
        id: audit
        continue-on-error: true
        run: PYTHONPATH=src python3 -m verifier audit

      - name: Write the review title and description
        if: always()
        env:
          CARDS_EXIT: ${{ steps.cards.outputs.exit_code }}
          LOOKUPS: ${{ steps.lookups.outcome }}
          BUILD: ${{ steps.build.outcome }}
          REPORT: ${{ steps.report.outcome }}
          REPORT_FILE: ${{ steps.report.outputs.file }}
          TESTS: ${{ steps.tests.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          cards="success"
          if [ "${CARDS_EXIT:-1}" != "0" ]; then cards="failure (exit ${CARDS_EXIT:-unknown})"; fi
          PYTHONPATH=src python3 -m verifier review-pr \
            --cards "${cards}" --lookups "${LOOKUPS}" --build "${BUILD}" --report "${REPORT}" \
            --tests "${TESTS}" --audit "${AUDIT}" --report-file "${REPORT_FILE}" --sample "${SAMPLE_ONLY}" \
            --cards-summary "${RUNNER_TEMP}/cards.json" --date "$(date -u +%Y-%m-%d)" \
            --title-out "${RUNNER_TEMP}/title.txt" --body-out "${RUNNER_TEMP}/review.md"
          cat "${RUNNER_TEMP}/review.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit to the review branch and open or update the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TITLE_FILE: ${{ runner.temp }}/title.txt
          BODY_FILE: ${{ runner.temp }}/review.md
          REVIEW_BRANCH: ${{ inputs.sample_only && 'review/sample' || 'review/weekly' }}
        run: bash scripts/review_commit.sh

      - name: Fail the run if any check failed (after the evidence is committed)
        if: always()
        env:
          CARDS_EXIT: ${{ steps.cards.outputs.exit_code }}
          LOOKUPS: ${{ steps.lookups.outcome }}
          BUILD: ${{ steps.build.outcome }}
          REPORT: ${{ steps.report.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          if [ "${CARDS_EXIT:-1}" != "0" ] || [ "${LOOKUPS}" != "success" ] || [ "${BUILD}" != "success" ] \
             || [ "${REPORT}" != "success" ] || [ "${TESTS}" != "success" ] || [ "${AUDIT}" != "success" ]; then
            echo "::error::Checks failed: cards exit ${CARDS_EXIT:-unknown}, lookups ${LOOKUPS}, build ${BUILD}, report ${REPORT}, tests ${TESTS}, audit ${AUDIT}. Fetched evidence was committed to the review branch."
            exit 1
          fi

      - name: Open or update an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.cards.outputs.exit_code }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${EXIT_CODE:-}" = "3" ]; then
            title="Verify stopped: robots.txt disallows a path (decision needed)"
            next="A robots.txt file now disallows a finding-card page. The pipeline stopped and will not fetch it. Jon decides what to do next."
          else
            title="Verify failed"
            next="The weekly verification did not complete. Forward the GitHub email to Jon, or ask Claude Code to look at the run."
          fi
          body=$(printf '%s\n\n**Run:** %s\n\n_Opened automatically by the verify workflow._' "${next}" "${run_url}")
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

  # GitHub 403 diagnostic: only when diagnose_403 is given. Uses api.github.com only,
  # with the built-in token for the repository endpoint and no token for the global one.
  diagnose:
    if: ${{ inputs.diagnose_403 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push the diagnostic branch
      pull-requests: write # open the diagnostic pull request
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Try other ways to read the refused advisories
        id: diag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IDS: ${{ inputs.diagnose_403 }}
        run: |
          file="reports/$(date -u +%Y-%m-%d)-diagnose-403.md"
          PYTHONPATH=src python3 -m verifier diagnose-403 --ids "${IDS}" --date "$(date -u +%Y-%m-%d)" --out "${file}"
          printf 'GitHub 403 diagnostic %s\n' "$(date -u +%Y-%m-%d)" > "${RUNNER_TEMP}/title.txt"
          cp "${file}" "${RUNNER_TEMP}/review.md"
          cat "${file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit to the diagnostic branch and open or update the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_FILE: ${{ runner.temp }}/title.txt
          BODY_FILE: ${{ runner.temp }}/review.md
          REVIEW_BRANCH: review/diagnose-403
        run: bash scripts/review_commit.sh
