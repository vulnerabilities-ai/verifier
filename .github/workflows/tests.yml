# Runs the test suite and the archive integrity check on every pull request
# and on pushes to main. Read-only: it can never change the repository.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (2026-07-16)
        with:
          persist-credentials: false
      - name: Unit tests and golden fixtures
        run: PYTHONPATH=src:tests python3 -m unittest discover -s tests -v
      - name: Archive integrity (every stored file matches its manifest)
        run: PYTHONPATH=src python3 -m verifier audit
